  <script>
  (function(){
    const param=new URLSearchParams(location.search).get('from_lang');
    if(param==='en'||param==='ja'){try{sessionStorage.setItem('ohlucinda-origin-lang',param)}catch(e){}}
    let lang=param==='en'||param==='ja'?param:null;
    if(!lang){try{lang=sessionStorage.getItem('ohlucinda-origin-lang')}catch(e){}}
    if(lang){document.querySelectorAll('a[href="https://ohlucinda.com/"]').forEach(a=>a.href='https://ohlucinda.com/?lang='+lang)}
  })();
  </script>
